# Deploys the real multiplayer server to Google Cloud Run when the "deploy" label... no: on manual run,
# or on every push to the default branch once the secrets below exist.
# Secrets needed (repo → Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID   your Firebase / Google Cloud project id
#   GCP_SA_KEY       JSON key of a service account with roles: Cloud Run Admin, Cloud Build Editor,
#                    Artifact Registry Administrator, Storage Admin, Service Account User
# Optional variables: GCP_REGION (default australia-southeast1), GCS_BUCKET (default <project>-jezza-data)
name: Deploy server to Cloud Run
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['server/**', 'shared/**', 'client/**', 'package*.json', 'Dockerfile', '.github/workflows/deploy-cloudrun.yml']
jobs:
  deploy:
    if: ${{ secrets.GCP_SA_KEY != '' }}
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION || 'australia-southeast1' }}
      SERVICE: project-jezza
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.GCP_SA_KEY }}' }
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BUCKET: ${{ vars.GCS_BUCKET }}
        run: |
          [ -n "$BUCKET" ] || unset BUCKET
          ./scripts/deploy-cloudrun.sh
